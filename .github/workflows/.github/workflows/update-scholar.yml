name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Scholar citations
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
        run: python scripts/update_scholar.py

      - name: Commit citation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/scholar.yml

          if git diff --cached --quiet; then
            echo "Citation count has not changed."
          else
            git commit -m "Update Google Scholar citations"
            git push
          fi
